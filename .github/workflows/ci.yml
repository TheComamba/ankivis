name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Linux and macOS: use the repository's bash scripts, as developers do.
      - name: Install
        if: runner.os != 'Windows'
        run: _scripts/setup.sh
      - name: Lint and test
        if: runner.os != 'Windows'
        run: _scripts/test.sh --cov=ankivis

      # Windows: the bash scripts are not supported, so install and test with pip directly.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[dev]"
      - name: Lint and test (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest --cov=ankivis

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Check installed version
        run: |
          python -m pip install dist/*.whl
          ankivis --version
