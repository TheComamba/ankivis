[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ankivis"
version = "0.1.0"
description = "Visualise learning progress for an Anki deck."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
ankivis = "ankivis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ankivis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
