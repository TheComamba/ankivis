[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ankivis"
dynamic = ["version"]
description = "Visualise learning progress for an Anki deck."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Simon Heidrich" }]
requires-python = ">=3.12"
keywords = ["anki", "flashcards", "spaced-repetition", "visualisation", "chart", "video"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "numpy>=2.5",
    "pillow>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.6",
    # The tests use ZoneInfo("Europe/Berlin"); Windows has no system time zone database.
    "tzdata; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/TheComamba/ankivis"
Source = "https://github.com/TheComamba/ankivis"
Issues = "https://github.com/TheComamba/ankivis/issues"
Changelog = "https://github.com/TheComamba/ankivis/blob/main/CHANGELOG.md"

[project.scripts]
ankivis = "ankivis.cli:app"

[tool.hatch.version]
path = "src/ankivis/__init__.py"

[tool.hatch.build.targets.sdist]
# Keep the source distribution small: the demo GIF (2 MB) and the historical plan are not needed.
exclude = ["/demo.gif", "/plans"]

[tool.hatch.build.targets.wheel]
packages = ["src/ankivis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
